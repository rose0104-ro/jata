'use strict';const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ages=['18–22 歲','23–27 歲','28–32 歲','33–39 歲','40 歲以上','不願透露'];const videos=['下雨突襲','手機砸臉','復古手機鈴聲跳舞','泡溫泉或其他療癒情境作品','訪談動畫 5','訪談動畫 6','訪談動畫 7','訪談動畫 8'];const surveyClips=Array.from({length:6},(_,i)=>['v'+(i+9),'問卷動畫 '+(i+1),'video']);const works=['突然下雨','手機砸臉','放假結束','早晨不想起床','讀書的日常','洗衣機','祈求舞','焦糖溫泉','摩托車騎乘','復古手機鈴聲'];const assets=[['character','正式角色圖片','image'],['emotion','角色情緒圖','image'],...videos.map((n,i)=>['v'+(i+1),n,'video']),...surveyClips,...works.map((n,i)=>['w'+(i+1),n,'image']),['goods','商品原型／實際照片','image']];const S=[['S01','請問你希望這次訪談使用什麼暱稱？',''],['S02','你目前的年齡區間是？',''],['S03','你平常有使用 Instagram 嗎？大概多久使用一次？','平常比較常觀看什麼類型的內容？'],['S04','在這次訪談之前，你有看過或認識 Jatakurimu（恰塔）嗎？','是在什麼地方看到的？還記得當時的情況嗎？'],['S05','你目前有追蹤 @jatakurimu 嗎？','如果有，是什麼原因讓你追蹤？如果沒有，之前是怎麼接觸到作品的？'],['S06','你大概多久會看到一次恰塔的貼文或動畫？','是經常觀看、偶爾滑到，還是幾乎沒有看過？'],['S07','在不看圖片提示的情況下，你還記得恰塔的任何一篇作品嗎？','可以描述一下那篇作品的內容嗎？']];

const rooms=[{name:'角色展示室',en:'GALLERY',c:'#d7b5a1',type:0,keys:[1,2,3,4,5].map(n=>qid(n))},{name:'復古動畫館',en:'ARCADE',c:'#81b7ae',type:1,keys:videos.map((_,i)=>qid(6+i%4,i+1))},{name:'日常生活室',en:'LIVING',c:'#e1bb91',type:2,keys:[10,11,12,13].map(n=>qid(n))},{name:'社群創作室',en:'STUDIO',c:'#b3b6d1',type:3,keys:[14,15,16,17,18].map(n=>qid(n))},{name:'恰塔雜貨店',en:'SHOP',c:'#a6bca0',type:4,keys:[19,20,21].map(n=>qid(n))},{name:'回憶與出口',en:'MEMORY',c:'#d5a6b9',type:5,keys:[23,24,25,26,27,28,29,22,30].map(n=>qid(n))}];function qid(n,v){return 'Q'+String(n).padStart(2,'0')+(v?'_V'+v:'')}const core=rooms.flatMap(r=>r.keys);function item(k){if(k[0]==='S'){let x=S.find(x=>x[0]===k);return {k,text:x[1],follow:x[2],media:[]}}if(k[0]==='Q'){let n=+k.slice(1,3),v=k.includes('_V')?+k.slice(-1):0;return {k,text:Q[n][0],follow:Q[n][1],media:v?['v'+v]:n<=5?['character']:n<=18?videos.map((_,i)=>'v'+(i+1)):n<=21?['goods']:[],video:v}}let [t,f]=extra[k[0]][+k.slice(1)-1];return {k,text:t,follow:f,media:[]}}
let db,urls={},fileNames={},state=null,page='home',active=null,recorder=null,recStream=null,recChunks=[],pendingAudio=null,toastTimer,frame=0;const KEY='jata_pixel_v9_draft',RK='jata_pixel_v2_records';function read(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('本機儲存失敗，請匯出備份。');return false}}function save(){if(state)write(KEY,state)}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3000)}function show(name,html){page=name;$('app').innerHTML=html;window.scrollTo(0,0)}function modal(html){$('dialog').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){if(recorder){toast('請先停止錄音並等儲存完成');return false}$('modal').classList.add('hidden');active=null;return true}function bar(n,t){return `<div class="meter"><i style="width:${Math.min(100,100*n/t)}%"></i></div>`}function event(type,data={}){if(state){state.events.push({type,...data,at:new Date().toISOString()});save()}}function initDB(){return new Promise(resolve=>{try{let r=indexedDB.open('jata_pixel_assets_v2',1);r.onupgradeneeded=()=>r.result.createObjectStore('blobs');r.onsuccess=()=>{db=r.result;let tx=db.transaction('blobs'),store=tx.objectStore('blobs'),ks=store.getAllKeys(),vs=store.getAll();tx.oncomplete=()=>{ks.result.forEach((k,i)=>{if(k.startsWith('asset:')){let id=k.slice(6);urls[id]=URL.createObjectURL(vs.result[i]);fileNames[id]=vs.result[i].name||id}});resolve()};tx.onerror=resolve};r.onerror=resolve}catch{resolve()}})}function blobPut(k,v){return new Promise((res,rej)=>{if(!db)return rej(Error('無本機素材資料庫'));let t=db.transaction('blobs','readwrite');v?t.objectStore('blobs').put(v,k):t.objectStore('blobs').delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}function blobGet(k){return new Promise((res,rej)=>{if(!db)return rej(Error('無資料庫'));let r=db.transaction('blobs').objectStore('blobs').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function media(id){let a=assets.find(a=>a[0]===id);if(!a)return '';let u=urls[id];return `<div><div class="media">${u?(a[2]==='video'?`<video class="jata-auto12" data-asset12="${E(id)}" autoplay muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture disableremoteplayback src="${E(u)}" aria-label="${E(assetLabel11(id))}"></video>`:`<img src="${u}" alt="正式研究素材">`):`<div class="placeholder">▧<br>正式${a[2]==='video'?'動畫':'圖片'}尚未上傳</div>`}</div><div class="muted">${E(assetLabel11(id))}</div></div>`}function medias(ids){return ids.length?`<div class="media-grid">${ids.map(media).join('')}</div>`:''}
function home(){if(!closeModal())return;save();let d=read(KEY,null);show('home',`<div class="hero"><div><span class="tag">INSERT COIN / START</span><h1>恰塔的<br>日常小世界</h1><div class="eyebrow">JATA'S LITTLE PIXEL WORLD</div><p>歡迎來到恰塔的小世界！一起觀看作品、分享你的真實感受，沒有標準答案。</p><div class="home-choice14"><b>請擇一參加即可</b><p>下方兩種研究方式只需選擇一種，不必兩種都完成。</p></div></div><canvas id="homeCanvas" width="352" height="240" aria-label="復古像素雜貨店預覽"></canvas></div><div class="cards home-modes14"><div class="panel"><span class="eyebrow">01 / ADVENTURE</span><h2>深度訪談｜像素小世界</h2><div class="mode-meta14"><span>約 35–45 分鐘</span><span>有遊戲</span></div><p>操控恰塔探索六間像素房間，一邊玩遊戲、一邊觀看作品並回答訪談問題。需要分享較多想法，時間可能依回答與探索進度延長。</p><div class="reward14"><b>完成直接送小禮物</b><p>五款壓克力吊飾任選兩款，不需要抽獎。完成後可留下 Email，方便安排領取。</p></div><button class="primary" onclick="consent('interview')">開始深度訪談 →</button></div><div class="panel"><span class="eyebrow">02 / QUICK SURVEY</span><h2>快速問卷｜作品與感受</h2><div class="mode-meta14"><span>約 5–10 分鐘</span><span>無遊戲</span></div><p>不需要操作角色或探索房間，直接觀看作品、勾選感受並完成問卷，適合想快速參與的人。</p><div class="reward14"><b>完成可參加禮物抽獎</b><p>結束時可選填 Email 登記抽獎，取得票券並截圖保存。若不參加，也能完成問卷。</p></div><button class="primary" onclick="consent('survey')">開始快速問卷 →</button></div></div><div class="home-reward-note14"><b>關於禮物：</b>贈禮及抽獎的安排時間尚未確定；若抽中禮物，研究者會透過你留下的 Email 另行通知。</div>${d?`<div class="panel row between"><div>找到尚未完成的本機旅程<br><span class="muted">${E(d.id)} · ${d.mode==='interview'?'訪談':'問卷'}</span></div><div class="row"><button class="primary" onclick="resume()">繼續旅程</button><button onclick="discard()">退出研究／清除草稿</button></div></div>`:''}<div class="foot">Jatakurimu 原創角色 IP 情感設計與內容創作策略研究｜本機測試版</div>`);drawHome()}
function discard(){if(confirm('確定清除未提交的草稿？')){state=null;localStorage.removeItem(KEY);home()}}function consent(mode){if(read(KEY,null)){toast('請先繼續或清除原本的草稿。');return}show('consent',`<div class="panel wide"><div class="eyebrow">RESEARCH / CONSENT</div><h1 class="title">研究說明與參與同意</h1><p><b>研究名稱：</b>以情感設計為視角之個人 IP 創業發展歷程的內容創作策略研究——以 Jatakurimu 品牌為個案</p><p>探討不同接觸經驗的觀眾如何理解恰塔的角色形象、情感特質及內容創作，並了解生活共鳴、社群互動意願與品牌延伸認知。</p><p>沒有標準答案，不需要特別給正面評價。若不想回答，可隨時暫停或退出研究，不影響你的權益。正式分析以代碼取代個人身分。</p><p>${mode==='interview'?'一對一訪談，約 35–45 分鐘，預計招募 8–10 位。':'快速問卷，約 5–10 分鐘（依前測調整）。'}</p><div class="warning">本版資料保存在目前瀏覽器，未傳送到研究者。正式收案前需由研究者補上聯絡方式、資料保存期限、退出與刪除方式，以及經確認的研究同意書。請勿輸入真實姓名等不必要的識別資料。</div><label class="field"><input id="agree" type="checkbox"> 我已了解研究說明，並自願參與</label>${mode==='interview'?'<label class="field">是否同意錄音？（非必須）</label><select id="audioConsent"><option value="no">不同意錄音</option><option value="yes">同意錄音</option></select>':''}<div class="row between" style="margin-top:20px"><button onclick="home()">返回</button><button class="primary" onclick="start('${mode}')">確認並開始</button></div></div>`)}function start(mode){if(!$('agree').checked)return toast('請先確認參與同意。');state={id:'JATA-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,10).toUpperCase(),mode,startedAt:new Date().toISOString(),consent:{participation:true,recording:$('audioConsent')?.value==='yes',version:'pixel-v9'},answers:{},survey:{},surveyDraft:{},sIndex:0,firstIndex:0,group:'pending',stage:mode==='interview'?'screen':'survey',surveyIndex:0,events:[],roomOrder:[],materials:Object.fromEntries(assets.map(a=>[a[0],fileNames[a[0]]||'MISSING'])),pos:{x:320,y:244}};save();resume()}function resume(){state=read(KEY,null);if(!state)return home();if(state.mode==='survey')return survey();switch(state.stage){case 'screen':return screening();case 'group':return grouping();case 'first':return game();case 'review':return review();default:return game()}}
